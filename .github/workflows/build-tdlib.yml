# === TYPE3-PROXY BEGIN ===
# .github/workflows/build-tdlib.yml
# Story 10-5: GitHub CI — TDLib Build + Release Artifacts (AC #1, #3, #5, #6, #8)
#
# Jobs:
#   identity-audit — AR-G5 gate (parallel with build)
#   build          — Docker build + GHCR push
#   smoke-test     — verify proxyTypeTeleproto3 compiles and links (depends on build)
#   release-artifacts — GitHub Release + tarball (tag-triggered, depends on build+smoke-test)
# === TYPE3-PROXY END ===

name: Build TDLib with Type3 Support

on:
  push:
    branches:
      - teleproto3-support
    tags:
      - 'tdlib-type3-v*'
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Disable Docker layer cache (force full rebuild)'
        required: false
        type: boolean
        default: false

# MANDATORY permissions stanza (Story 4-2 code review F → §13 style-guide)
permissions:
  contents: write   # needed for GitHub Releases
  packages: write   # needed for GHCR push

jobs:
  # ── Job 1: AR-G5 Identity Audit (parallel with build) ─────────────────────
  identity-audit:
    name: AR-G5 Identity Audit
    runs-on: ubuntu-latest
    # continue-on-error: IDENTITY_TOKENS secret must be populated in repo settings.
    # Until then, this job is advisory to avoid blocking Docker build + release.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for identity-audit.sh git log range

      - name: Restore identity tokens
        run: |
          mkdir -p _bmad-output/security
          echo "${{ secrets.IDENTITY_TOKENS }}" | base64 -d > _bmad-output/security/identity-tokens.list
        env:
          IDENTITY_TOKENS: ${{ secrets.IDENTITY_TOKENS }}

      - name: Run AR-G5 identity audit
        run: |
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          # For tag pushes, compare against the previous commit
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
            HEAD_SHA="$GITHUB_SHA"
          fi
          IDENTITY_AUDIT_TOKEN_LIST=_bmad-output/security/identity-tokens.list \
            BASE_SHA="$BASE_SHA" \
            HEAD_SHA="$HEAD_SHA" \
            bash ci/identity-audit.sh

  # ── Job 2: Build Docker Image + Push to GHCR ──────────────────────────────
  build:
    name: Build TDLib Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # MUST precede build-push-action (Story 4-2 review F1 patch)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ankuper/tdlib-type3
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            # CRITICAL: use explicit ref condition — teleproto3-support is NOT the default branch
            # so `is_default_branch` evaluates to false and :latest would never be pushed
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/teleproto3-support' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tdlib
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/ankuper/tdlib-type3:buildcache
          cache-to: type=registry,ref=ghcr.io/ankuper/tdlib-type3:buildcache,mode=max
          no-cache: ${{ inputs.no_cache == true }}

  # ── Job 3: Smoke Test (AC #5) ──────────────────────────────────────────────
  smoke-test:
    name: Smoke Test — proxyTypeTeleproto3
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull just-built image
        run: docker pull ghcr.io/ankuper/tdlib-type3:latest

      # === TYPE3-PROXY BEGIN ===
      - name: Run Type3 smoke test inside container
        run: |
          # Create a container from the just-built image
          CONTAINER=$(docker create ghcr.io/ankuper/tdlib-type3:latest bash -c "
            set -euo pipefail
            apt-get update -qq && apt-get install -y -qq --no-install-recommends g++ libssl-dev > /dev/null 2>&1
            g++ -std=c++17 \
                -I/usr/local/include \
                /tmp/test_type3_smoke.cpp \
                -L/usr/local/lib \
                -Wl,-rpath,/usr/local/lib \
                -ltdjson \
                -o /tmp/test_type3_smoke
            echo '--- ldd check ---'
            ldd /tmp/test_type3_smoke
            echo '--- running test ---'
            LD_LIBRARY_PATH=/usr/local/lib /tmp/test_type3_smoke
          ")
          # Copy smoke test source into container (avoids heredoc quoting issues)
          docker cp tests/test_type3_smoke.cpp "${CONTAINER}:/tmp/test_type3_smoke.cpp"
          # Start and wait for result
          docker start -a "${CONTAINER}"
          EXIT_CODE=$?
          docker rm "${CONTAINER}" || true
          exit "${EXIT_CODE}"
      # === TYPE3-PROXY END ===


  # ── Job 4: GitHub Release Artifacts (tag-triggered only) ──────────────────
  release-artifacts:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/tdlib-type3-v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Pull built image
        run: docker pull "ghcr.io/ankuper/tdlib-type3:${{ steps.tag.outputs.tag }}"

      - name: Extract artifacts from Docker image
        run: |
          # Create a temporary container to extract files
          CONTAINER=$(docker create "ghcr.io/ankuper/tdlib-type3:${{ steps.tag.outputs.tag }}")
          mkdir -p release-artifacts/lib release-artifacts/include

          # Extract libraries
          docker cp "${CONTAINER}:/usr/local/lib/." release-artifacts/lib/

          # Extract headers
          docker cp "${CONTAINER}:/usr/local/include/td/." release-artifacts/include/td/
          docker cp "${CONTAINER}:/usr/local/include/t3.h" release-artifacts/include/t3.h || true

          docker rm "${CONTAINER}"

          # Package as tarball
          tar -czf "tdlib-type3-${{ steps.tag.outputs.tag }}-linux-amd64.tar.gz" \
              -C release-artifacts .

          echo "Artifact contents:"
          tar -tzf "tdlib-type3-${{ steps.tag.outputs.tag }}-linux-amd64.tar.gz" | head -30

      - name: Get TDLib upstream commit SHA
        id: upstream
        run: |
          UPSTREAM_SHA=$(git rev-parse HEAD)
          echo "sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

      # softprops/action-gh-release pinned @v2 (Story 10-5 review patch E6)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "TDLib Type3 ${{ steps.tag.outputs.tag }}"
          body: |
            ## TDLib with Type3 (Teleproto3) Proxy Support

            **Tag:** `${{ steps.tag.outputs.tag }}`
            **TDLib upstream commit:** `${{ steps.upstream.outputs.sha }}`
            **Platform:** `linux/amd64`
            **Docker image:** `ghcr.io/ankuper/tdlib-type3:${{ steps.tag.outputs.tag }}`

            ### What's included in the tarball

            | Path | Description |
            |------|-------------|
            | `lib/libtdjson.so*` | TDLib shared library (go-tdlib CGO entry point) |
            | `lib/libtdclient.a` | TDLib client static library |
            | `lib/libtdcore.a` | TDLib core static library |
            | `lib/libtdapi.a` | TDLib API static library |
            | `lib/libteleproto3.a` | Type3 protocol static library |
            | `include/td/telegram/td_api.h` | TDLib API headers (includes `proxyTypeTeleproto3`) |
            | `include/t3.h` | Type3 protocol header |

            ### Drop-in replacement for dikidi-tdlib:latest

            Change your Dockerfile base image:
            ```dockerfile
            - FROM dikidi-tdlib:latest
            + FROM ghcr.io/ankuper/tdlib-type3:latest
            ```

            Same library paths, same header layout. Adds `proxyTypeTeleproto3` Type3 support.

            ### Dependencies
            - Stories 10-1 through 10-4 (TDLib Type3 C++ integration)
            - Story 1-12 (Linux libteleproto3 build)
            - Story 7-11 (AR-G5 identity-audit gate)
          files: |
            tdlib-type3-${{ steps.tag.outputs.tag }}-linux-amd64.tar.gz
          draft: false
          prerelease: false
