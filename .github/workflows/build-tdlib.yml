# === TYPE3-PROXY BEGIN ===
# .github/workflows/build-tdlib.yml
# CI: TDLib Build + Release Artifacts
#
# Matrix build:
#   - linux-amd64  (ubuntu-latest, Docker image + native libs)
#   - linux-arm64  (ubuntu-24.04-arm, native build)
#   - macos-arm64  (macos-14, Apple Silicon native)
#
# On every push: upload-artifact for all platforms
# On tag push:   GitHub Release with all platform tarballs
# === TYPE3-PROXY END ===

name: Build TDLib with Type3 Support

on:
  push:
    branches:
      - teleproto3-support
    tags:
      - 'tdlib-type3-v*'
  pull_request:
    branches:
      - teleproto3-support
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Disable Docker layer cache (force full rebuild)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  # Per release rules (CLAUDE.md): consume the prebuilt libteleproto3 from the
  # teleproto3 GitHub Release — never build it from source. Pinned to a
  # release/tag (policy: never float to `latest`). Bump to roll the whole CI
  # (native matrix + Docker image) to a new teleproto3 version.
  TELEPROTO3_VERSION: lib-v0.8.2

jobs:
  # ── Identity Audit ─────────────────────────────────────────────────────────
  identity-audit:
    name: AR-G5 Identity Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore identity tokens
        run: |
          mkdir -p _bmad-output/security
          echo "${{ secrets.IDENTITY_TOKENS }}" | base64 -d > _bmad-output/security/identity-tokens.list
      - name: Run AR-G5 identity audit
        run: |
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
            HEAD_SHA="$GITHUB_SHA"
          fi
          IDENTITY_AUDIT_TOKEN_LIST=_bmad-output/security/identity-tokens.list \
            BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" \
            bash ci/identity-audit.sh

  # ── Docker Image (linux/amd64) — GHCR push ────────────────────────────────
  docker-image:
    name: Docker Image (linux/amd64)
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ankuper/tdlib-type3
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/teleproto3-support' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tdlib
          platforms: linux/amd64
          build-args: |
            TELEPROTO3_VERSION=${{ env.TELEPROTO3_VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/ankuper/tdlib-type3:buildcache
          cache-to: type=registry,ref=ghcr.io/ankuper/tdlib-type3:buildcache,mode=max
          no-cache: ${{ inputs.no_cache == true }}

  # ── Native builds (matrix) ────────────────────────────────────────────────
  build-native:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # t3asset = matching prebuilt libteleproto3 tarball from the teleproto3
      # release. teleproto3 ships no Intel-mac prebuilt (macos-x64 dropped
      # upstream), so this matrix mirrors the available targets: the two Linux
      # arches + Apple Silicon. This also realigns the matrix with the release
      # job's `files:` list (previously the matrix built macos-x64 while the
      # release referenced a never-built linux-arm64 artifact).
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            os: linux
            arch: amd64
            artifact: tdlib-type3-linux-amd64
            t3asset: libteleproto3-linux-x86_64.tar.gz
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            artifact: tdlib-type3-linux-arm64
            t3asset: libteleproto3-linux-aarch64.tar.gz
          - name: macos-arm64
            runner: macos-14
            os: macos
            arch: arm64
            artifact: tdlib-type3-macos-arm64
            t3asset: libteleproto3-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      # ── Install dependencies ───────────────────────────────────────────
      - name: Install deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake g++ make git zlib1g-dev libssl-dev gperf

      - name: Install deps (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install openssl@3 zlib gperf cmake
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      # ── Download prebuilt libteleproto3 from release ───────────────────
      # CLAUDE.md release rule: download the prebuilt static lib from the
      # teleproto3 GitHub Release — never build from source. The tarball
      # extracts to lib/libteleproto3.a + lib/include/{t3.h,t3_client.h,...}.
      - name: Download libteleproto3 ${{ env.TELEPROTO3_VERSION }}
        run: |
          mkdir -p /tmp/teleproto3
          if [ "$TELEPROTO3_VERSION" = "latest" ]; then
            T3_BASE="https://github.com/ankuper/teleproto3/releases/latest/download"
          else
            T3_BASE="https://github.com/ankuper/teleproto3/releases/download/${TELEPROTO3_VERSION}"
          fi
          curl -fsSL \
            "${T3_BASE}/${{ matrix.t3asset }}" \
            -o /tmp/teleproto3/lib.tar.gz
          tar -xzf /tmp/teleproto3/lib.tar.gz -C /tmp/teleproto3
          echo "TELEPROTO3_LIB_DIR=/tmp/teleproto3/lib" >> "$GITHUB_ENV"
          echo "TELEPROTO3_INCLUDE_DIR=/tmp/teleproto3/lib/include" >> "$GITHUB_ENV"

      # ── Build TDLib ────────────────────────────────────────────────────
      - name: Configure TDLib
        run: |
          mkdir -p build
          CMAKE_EXTRA=""
          if [ "${{ matrix.os }}" = "macos" ]; then
            CMAKE_EXTRA="-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DTELEPROTO3_LIB_DIR="$TELEPROTO3_LIB_DIR" \
            -DTELEPROTO3_INCLUDE_DIR="$TELEPROTO3_INCLUDE_DIR" \
            -DT3_STATIC_LIB=ON \
            $CMAKE_EXTRA

      - name: Build TDLib
        run: cmake --build build --target install -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      # ── Package artifacts ──────────────────────────────────────────────
      - name: Package libraries
        run: |
          DIST="${{ github.workspace }}/dist"
          mkdir -p "$DIST/lib" "$DIST/include"

          # Libraries (shared + static)
          if [ "${{ matrix.os }}" = "linux" ]; then
            cp -P install/lib/libtdjson.so* "$DIST/lib/" 2>/dev/null || true
          else
            # macOS versions the dylib as libtdjson.<ver>.dylib (version BEFORE
            # .dylib), so `libtdjson*.dylib` catches BOTH the symlink and the real
            # file. `libtdjson.dylib*` matched only the symlink → dangling in tarball.
            cp -P install/lib/libtdjson*.dylib "$DIST/lib/" 2>/dev/null || true
          fi
          cp install/lib/*.a "$DIST/lib/" 2>/dev/null || true

          # libteleproto3
          cp "$TELEPROTO3_LIB_DIR/libteleproto3.a" "$DIST/lib/" 2>/dev/null || true
          cp "$TELEPROTO3_INCLUDE_DIR/t3.h" "$DIST/include/" 2>/dev/null || true

          # Headers
          cp -r install/include/td "$DIST/include/" 2>/dev/null || true

          echo "=== Artifact contents ==="
          find "$DIST" -type f | sort
          echo "=== Library sizes ==="
          ls -lh "$DIST/lib/"

      - name: Create tarball
        run: |
          cd ${{ github.workspace }}/dist
          tar -czf "${{ github.workspace }}/${{ matrix.artifact }}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          retention-days: 30

  # ── Smoke Test ─────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: docker-image
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and test
        run: |
          docker pull ghcr.io/ankuper/tdlib-type3:latest
          CONTAINER=$(docker create ghcr.io/ankuper/tdlib-type3:latest bash -c "
            set -euo pipefail
            apt-get update -qq && apt-get install -y -qq --no-install-recommends g++ libssl-dev > /dev/null 2>&1
            g++ -std=c++17 -I/usr/local/include /tmp/test_type3_smoke.cpp \
                -L/usr/local/lib -Wl,-rpath,/usr/local/lib -ltdjson -o /tmp/test_type3_smoke
            echo '--- ldd check ---'
            ldd /tmp/test_type3_smoke
            echo '--- running test ---'
            LD_LIBRARY_PATH=/usr/local/lib /tmp/test_type3_smoke
          ")
          docker cp tests/test_type3_smoke.cpp "${CONTAINER}:/tmp/test_type3_smoke.cpp"
          docker start -a "${CONTAINER}"
          docker rm "${CONTAINER}" || true

  # ── GitHub Release (tag-triggered) ─────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-native, smoke-test]
    if: startsWith(github.ref, 'refs/tags/tdlib-type3-v')
    steps:
      - uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          # Only the per-platform tarballs — NOT the `*.dockerbuild` build-record
          # artifact buildx auto-uploads (it fails download-artifact and breaks the
          # release; it is not a release asset anyway).
          pattern: 'tdlib-type3-*'
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Extract tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "TDLib Type3 ${{ steps.tag.outputs.tag }}"
          body: |
            ## TDLib with Type3 (Teleproto3) Proxy Support

            **Tag:** `${{ steps.tag.outputs.tag }}`
            **Commit:** `${{ github.sha }}`
            **libteleproto3:** `${{ env.TELEPROTO3_VERSION }}` (prebuilt, from teleproto3 release)

            ### Platform Artifacts

            | File | Platform | Arch |
            |------|----------|------|
            | `tdlib-type3-linux-amd64.tar.gz` | Linux | x86_64 |
            | `tdlib-type3-linux-arm64.tar.gz` | Linux | aarch64 |
            | `tdlib-type3-macos-arm64.tar.gz` | macOS | Apple Silicon |

            ### Contents (each tarball)

            | Path | Description |
            |------|-------------|
            | `lib/libtdjson.so*` / `lib/libtdjson.dylib` | TDLib shared library |
            | `lib/libtdclient.a` | TDLib client static library |
            | `lib/libtdcore.a` | TDLib core static library |
            | `lib/libtdmtproto.a` | TDLib MTProto static library |
            | `lib/libteleproto3.a` | Type3 protocol static library |
            | `include/td/` | TDLib headers |
            | `include/t3.h` | Type3 protocol header |

            ### Docker Image (linux/amd64)
            ```
            docker pull ghcr.io/ankuper/tdlib-type3:${{ steps.tag.outputs.tag }}
            ```

            ### Transport
            - `https://` endpoint → Type3 HTTP stream (POST + chunked framing inside TLS) — TSPU/DPI-safe.
            - HTTP stream is the only supported transport. WebSocket (`wss://`) is removed: a WS upgrade on the wire is itself a DPI fingerprint.
          files: |
            release-artifacts/tdlib-type3-linux-amd64/tdlib-type3-linux-amd64.tar.gz
            release-artifacts/tdlib-type3-linux-arm64/tdlib-type3-linux-arm64.tar.gz
            release-artifacts/tdlib-type3-macos-arm64/tdlib-type3-macos-arm64.tar.gz
          draft: false
          prerelease: false
